  <circle cx="50" cy="30" r="3" fill="#ffffff"/>
  <circle cx="70" cy="35" r="3" fill="#ffffff"/>
  <circle cx="35" cy="50" r="3" fill="#ffffff"/>
  <circle cx="65" cy="50" r="3" fill="#ffffff"/>
  <!-- NFL text -->
  <text x="50" y="80" 
        font-family="Arial Black, sans-serif" 
        font-size="28" 
        font-weight="bold" 
        fill="#ffffff" 
